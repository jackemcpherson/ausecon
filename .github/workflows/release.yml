name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish packages to npm
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # npm trusted publishing derives short-lived credentials from the OIDC token.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check that the tag matches both package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for package in packages/core packages/cli; do
            version=$(node -p "require('./${package}/package.json').version")
            if [ "v${version}" != "${RELEASE_TAG}" ]; then
              echo "${package} is at ${version}, but the tag is ${RELEASE_TAG}" >&2
              exit 1
            fi
          done

      - name: Build
        run: bun run build

      # Bun replaces the workspace:* dependency with the real version when it packs.
      - name: Pack both packages
        run: |
          (cd packages/core && bun pm pack --destination "$RUNNER_TEMP/packages")
          (cd packages/cli && bun pm pack --destination "$RUNNER_TEMP/packages")

      - name: Publish the library
        run: npm publish "$RUNNER_TEMP"/packages/ausecon-core-*.tgz --provenance --access public

      - name: Publish the command-line tool
        run: npm publish "$RUNNER_TEMP"/packages/ausecon-[0-9]*.tgz --provenance --access public
